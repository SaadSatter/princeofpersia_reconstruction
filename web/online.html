<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadow Masque online</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { background: #0d0e12; color: #d8d4c8; font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  #game canvas { image-rendering: pixelated; }
  #status, #hud, #outcome, #rival { margin: 4px 0; }
  #status[data-state="paused"], #status[data-state="error"] { color: #e08040; }
  /* Decision #96: the loading / connecting screen fills the window and centres its text, so a
     resize keeps it centred (viewport-relative, no script). */
  #status[data-state="loading"] { position: fixed; top: 0; left: 0; right: 0; bottom: 0; inset: 0;
    z-index: 10; display: flex; align-items: center; justify-content: center; text-align: center;
    margin: 0; background: #0d0e12; color: #f0c040; font: bold 20px monospace; letter-spacing: 2px; }
  #outcome { font-size: 18px; color: #f0c040; min-height: 1.4em; }
  .keys { color: #9a968c; font-size: 13px; }
  /* The landing state reuses the game's stone button look from ui.js (.sm-rematch-btn). */
  #lobby { margin: 12px 0; max-width: 360px; }
  #lobby .sm-rematch-btn { display: block; width: 100%; margin: 12px 0; }
  #lobby .or { text-align: center; color: #9a968c; margin: 8px 0; letter-spacing: 2px; }
  #code-input { -webkit-appearance: none; appearance: none; width: 100%; box-sizing: border-box;
    border: 0; border-radius: 0; background: #1a1d28; color: #f0c040; text-align: center;
    font: bold 28px monospace; letter-spacing: 8px; text-transform: uppercase; padding: 10px 0;
    box-shadow: 4px 0 0 #0d0e12, -4px 0 0 #0d0e12, 0 4px 0 #0d0e12, 0 -4px 0 #0d0e12,
      inset 4px 4px 0 #0d0e12, inset -4px -4px 0 #3a4256; }
  #code-input:focus { outline: 4px solid #f0c040; outline-offset: 4px; }
  #mode-pick .sm-rematch-btn[aria-pressed="true"] { color: #fff; outline: 4px solid #f0c040; outline-offset: 4px; }
  #lobby-msg { color: #e08040; min-height: 1.4em; text-align: center; }
  #room { display: none; margin: 4px 0; }
  #room-code { font: bold 28px monospace; letter-spacing: 8px; color: #f0c040; }
</style>
<!-- Phaser is pinned in web/versions.json; tools/web/build.py fills it in. -->
<script src="{{PHASER_URL}}"></script>
<script src="keys.js"></script>
<script src="draw.js"></script>
<script src="ui.js"></script>
</head>
<body>
<h1>Shadow Masque</h1>
<div id="status" data-state="loading">loading</div>
<div id="lobby">
  <div id="mode-pick" role="group" aria-label="Game mode"></div>
  <div id="human-lobby" style="display: none">
    <button type="button" id="create-room" class="sm-rematch-btn">Create room</button>
    <div class="or">or</div>
    <input id="code-input" maxlength="4" autocomplete="off" autocapitalize="characters"
           spellcheck="false" placeholder="CODE" aria-label="4-letter room code">
    <button type="button" id="join-room" class="sm-rematch-btn">Join room</button>
  </div>
  <div id="lobby-msg"></div>
</div>
<div id="room">Room code <span id="room-code"></span> (read it out to your rival)</div>
<div id="rival"></div>
<div id="game"></div>
<div id="hud"></div>
<div id="outcome"></div>
<div>build <span id="build">?</span></div>
<p class="keys" id="keys"></p>
<script src="online.js"></script>
</body>
</html>
