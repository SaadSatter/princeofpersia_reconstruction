# Development CI for the personal repository only.
# The course-repository workflow is ci/midterm-saadsatter.yml (copied to
# game-dev-f26/.github/workflows/ at transfer). A green run here does not
# satisfy rubric check 3c; it keeps main honest while we build.
name: Deterministic checks (dev)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (lockfile, no extras, no network at test time)
        run: uv sync --frozen
      - name: Deterministic tests (no API keys, no original level files)
        run: uv run --frozen pytest -q
